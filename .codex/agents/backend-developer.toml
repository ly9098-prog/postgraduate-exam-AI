- 微信 openid 是 App 用户唯一标识，Admin 使用独立 JWT 域，不混用
- AI 模型凭据存数据库 `admin_ai_model_configs`（AI_CONFIG_ENCRYPT_KEY 加密），不用环境变量
- 不引入 LangChain/LlamaIndex/微服务/Kubernetes
