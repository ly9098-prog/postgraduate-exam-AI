# 2240AI — 生产环境 docker-compose
# 使用方法：
#   docker compose -f deploy/docker-compose.prod.yml --env-file backend/.env up -d
#   docker compose -f deploy/docker-compose.prod.yml --env-file backend/.env exec app alembic upgrade head

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    mem_limit: 512m
    mem_reservation: 384m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpass}
      POSTGRES_DB: ${POSTGRES_DB:-postgraduate}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pguser}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    mem_limit: 128m
    mem_reservation: 64m
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    restart: always
    mem_limit: 512m
    mem_reservation: 384m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      PROCESS_ROLE: ${PROCESS_ROLE:-web}
      APP_SECRET: ${APP_SECRET:?必须设置 APP_SECRET}
      DATABASE_URL: ${DATABASE_URL:?必须设置 DATABASE_URL}
      AI_TIMEOUT: ${AI_TIMEOUT:-60}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-50000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?必须设置 WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?必须设置 WECHAT_APP_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://xzshub.top"]}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["xzshub.top"]}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://xzshub.top}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_MAX_WORKERS: ${OCR_MAX_WORKERS:-1}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-cloud_api}
      OCR_USE_GPU: ${OCR_USE_GPU:-false}
      OCR_EXECUTION_BACKEND: ${OCR_EXECUTION_BACKEND:-disabled}
      OCR_REMOTE_URL: ${OCR_REMOTE_URL:-}
      OCR_REMOTE_TOKEN: ${OCR_REMOTE_TOKEN:-}
      OCR_REMOTE_CONNECT_TIMEOUT_SEC: ${OCR_REMOTE_CONNECT_TIMEOUT_SEC:-5}
      OCR_REMOTE_READ_TIMEOUT_SEC: ${OCR_REMOTE_READ_TIMEOUT_SEC:-600}
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # PDF 导入限制（cloud_api 必须显式设置）
      PDF_RENDER_PAGE_WINDOW: ${PDF_RENDER_PAGE_WINDOW:-1}
      PDF_MAX_RENDER_PAGES_CONCURRENT: ${PDF_MAX_RENDER_PAGES_CONCURRENT:-1}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-30}
      PDF_MAX_DECODED_BYTES: ${PDF_MAX_DECODED_BYTES:-52428800}
      PDF_MAX_FILE_SIZE_BYTES: ${PDF_MAX_FILE_SIZE_BYTES:-5242880}
      # 数据库连接池（按角色拆分）
      DB_POOL_SIZE_WEB: ${DB_POOL_SIZE_WEB:-3}
      DB_MAX_OVERFLOW_WEB: ${DB_MAX_OVERFLOW_WEB:-5}
      DB_POOL_SIZE_WORKER: ${DB_POOL_SIZE_WORKER:-2}
      DB_MAX_OVERFLOW_WORKER: ${DB_MAX_OVERFLOW_WORKER:-3}
      DB_POOL_SIZE_SCHEDULER: ${DB_POOL_SIZE_SCHEDULER:-1}
      DB_MAX_OVERFLOW_SCHEDULER: ${DB_MAX_OVERFLOW_SCHEDULER:-2}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-500}
      SQL_ECHO: ${SQL_ECHO:-false}
      SQL_LOG_LEVEL: ${SQL_LOG_LEVEL:-WARNING}
      # AI 配置加密密钥（Fernet）
      AI_CONFIG_ENCRYPT_KEY: ${AI_CONFIG_ENCRYPT_KEY:?必须设置 AI_CONFIG_ENCRYPT_KEY}
      # 导出 PDF 文件存储
      EXPORT_DIR: ${EXPORT_DIR:-/opt/2240ai-v2/exports}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      WORKER_SCRATCH_DIR: ${WORKER_SCRATCH_DIR:-/tmp}
      PRODUCT_NAME: ${PRODUCT_NAME:-MemoGrad}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - staging_data:/opt/2240ai-v2/staging
      - exports_data:/opt/2240ai-v2/exports
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; resp = urllib.request.urlopen('http://localhost:8000/health/live', timeout=5); assert resp.status == 200\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Export scheduler — background processor for pending export tasks.
  # Must be deployed alongside web for export feature to work.
  #   PROCESS_ROLE=scheduler  → runs export processor, token cleanup, etc.
  #   No HTTP server, no exposed ports, no healthcheck.
  # Uses the same image as app but with a non-HTTP entry point.
  scheduler:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    restart: always
    mem_limit: 384m
    mem_reservation: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      PROCESS_ROLE: scheduler
      APP_SECRET: ${APP_SECRET:?必须设置 APP_SECRET}
      DATABASE_URL: ${DATABASE_URL:?必须设置 DATABASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-cloud_api}
      EXPORT_DIR: ${EXPORT_DIR:-/opt/2240ai-v2/exports}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      EXPORT_FEATURE_ENABLED: ${EXPORT_FEATURE_ENABLED:-true}
      EXPORT_WEBSOCKET_ENABLED: ${EXPORT_WEBSOCKET_ENABLED:-true}
      EXPORT_ALLOW_ALL_USERS: ${EXPORT_ALLOW_ALL_USERS:-false}
      EXPORT_ALLOWED_USER_IDS: ${EXPORT_ALLOWED_USER_IDS:-}
      EXPORT_POLL_INTERVAL_SEC: ${EXPORT_POLL_INTERVAL_SEC:-5}
      EXPORT_PROCESSING_TIMEOUT_SEC: ${EXPORT_PROCESSING_TIMEOUT_SEC:-900}
      EXPORT_HEARTBEAT_INTERVAL_SEC: ${EXPORT_HEARTBEAT_INTERVAL_SEC:-30}
      EXPORT_MAX_CONCURRENT: ${EXPORT_MAX_CONCURRENT:-2}
      EXPORT_MAX_PER_USER: ${EXPORT_MAX_PER_USER:-2}
      EXPORT_MAX_QUESTIONS: ${EXPORT_MAX_QUESTIONS:-100}
      DB_POOL_SIZE_SCHEDULER: ${DB_POOL_SIZE_SCHEDULER:-1}
      DB_MAX_OVERFLOW_SCHEDULER: ${DB_MAX_OVERFLOW_SCHEDULER:-2}
      # AI 配置加密密钥（Fernet）
      AI_CONFIG_ENCRYPT_KEY: ${AI_CONFIG_ENCRYPT_KEY:?必须设置 AI_CONFIG_ENCRYPT_KEY}
      # 生产验证所需（scheduler 虽无 HTTP，但配置验证器会检查）
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://xzshub.top"]}
      OCR_USE_GPU: ${OCR_USE_GPU:-false}
      OCR_EXECUTION_BACKEND: ${OCR_EXECUTION_BACKEND:-disabled}
      PDF_RENDER_PAGE_WINDOW: ${PDF_RENDER_PAGE_WINDOW:-1}
      PDF_MAX_RENDER_PAGES_CONCURRENT: ${PDF_MAX_RENDER_PAGES_CONCURRENT:-1}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-30}
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - exports_data:/opt/2240ai-v2/exports
    # Override CMD: run scheduler_main instead of gunicorn (no HTTP server)
    command: ["python", "-m", "app.scheduler_main"]

  admin:
    build:
      context: ../admin-frontend
      dockerfile: Dockerfile
    restart: always
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_ADMIN_API_BASE_URL: ${NEXT_PUBLIC_ADMIN_API_BASE_URL:-/api/admin/v1}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - app

  nginx:
    image: nginx:1.25-alpine
    restart: always
    mem_limit: 64m
    mem_reservation: 32m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./../cert:/etc/nginx/ssl:ro
      - ./../certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app

  # PostgreSQL 定期备份服务（手动触发，不随 compose up 自动启动）
  # 使用方法：
  #   docker compose -f deploy/docker-compose.prod.yml --env-file backend/.env run --rm backup
  # 通过宿主机 systemd timer 或 crontab 定时执行：
  #   0 3 * * * cd /opt/2240ai-v2 && docker compose -f deploy/docker-compose.prod.yml --env-file backend/.env run --rm backup >> logs/backup_cron.log 2>&1
  backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backup
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?必须设置 DATABASE_URL}
      BACKUP_DIR: /backups
      BACKUP_PREFIX: ${BACKUP_PREFIX:-postgraduate}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_LOG_FILE: /app/logs/postgres_backup.log
      BACKUP_COMMAND_TIMEOUT_SEC: ${BACKUP_COMMAND_TIMEOUT_SEC:-3600}
      BACKUP_COMPRESSION_LEVEL: ${BACKUP_COMPRESSION_LEVEL:-6}
    volumes:
      - backup_data:/backups
    profiles:
      - manual
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata_prod:
  redisdata_prod:
  nginx_logs:
  backup_data:
  staging_data:
  exports_data:
