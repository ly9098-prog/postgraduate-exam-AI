version: "3.8"

services:
  app:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    env_file:
      - ../backend/.env
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgraduate
      POSTGRES_PASSWORD: dev-password
      POSTGRES_DB: postgraduate_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgraduate"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
