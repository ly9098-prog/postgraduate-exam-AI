# 2240AI — 生产环境 docker-compose
# 使用方法：
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml exec app alembic upgrade head

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-pguser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pgpass}
      POSTGRES_DB: ${DB_NAME:-postgraduate}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pguser}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: ../deploy/Dockerfile.prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_SECRET: ${APP_SECRET:?必须设置 APP_SECRET}
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-pguser}:${DB_PASSWORD:-pgpass}@db:5432/${DB_NAME:-postgraduate}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI_TIMEOUT: ${AI_TIMEOUT:-60}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-50000}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?必须设置 WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?必须设置 WECHAT_APP_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-[\"https://your-domain.com\"]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app

volumes:
  pgdata:
  nginx_logs:
