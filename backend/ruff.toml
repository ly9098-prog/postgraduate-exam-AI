[lint]
# Relaxed rules for pre-existing codebase:
# - E402: late imports (admin modules with module-level config)
# - E501: long lines (pervasive in prompt strings and docstrings)
# - E741: ambiguous variable names (grandfathered)
# - N806: variable naming in functions (grandfathered)
ignore = ["E402", "E501", "E741", "N806"]
select = ["E", "F", "I", "N", "W"]
