[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "postgraduate-ai-backend"
version = "0.1.0"
description = "AI考研错题本 / 智能刷题 — OCR pipeline backend"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.25",
    "ruff>=0.1",
    "mypy>=1.7",
]
docx = [
    "python-docx>=1.1.0",
    "latex2mathml>=3.80.0",
]
pdf = [
    "fpdf2>=2.7.0",
    "Pillow>=10.0",
]
dev = [
    "ipython",
    "watchfiles",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N812",  # lowercase imported as non-lowercase
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "paddleocr.*",
    "paddle.*",
    "cv2.*",
    "fitz.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (real DB/Redis)",
    "cloud_ocr_isolation: Cloud OCR isolation tests",
    "redis: Tests requiring Redis",
    "postgres: Tests requiring PostgreSQL",
    "shutdown: Graceful shutdown tests",
    "slow: Slow running tests (> 5s)",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "N806", "N807", "N811", "N812", "N813", "N814", "N815", "N816", "N817", "N818"]

