[pytest]
testpaths = tests/test_process_pool_lifecycle.py tests/ocr_regression tests/test_services tests/test_features tests/test_ocr_request.py tests/test_module_result.py tests/test_document_ir_validator.py tests/test_backend_field_boundary.py tests/test_ocr_adapter.py tests/test_module_benchmarks.py tests/test_canary_config.py tests/test_canary_bucket_assignment.py tests/test_canary_group_execution.py tests/test_ir_canary_fallback.py tests/test_canary_health_decision.py tests/test_canary_auto_stop.py tests/test_canary_rollback.py tests/test_canary_artifact_persistence.py tests/test_canary_resume.py tests/test_canary_review_outcome.py tests/test_canary_failure_export.py tests/test_canary_feature_flag_matrix.py tests/test_canary_fault_injection.py tests/test_release_decision.py tests/test_canary_data_redaction.py
python_files = runner.py test_*.py
markers =
    ocr: OCR regression test cases
    real_image: Regression cases sourced from real device images
    synthetic: Regression cases sourced from synthetic text fixtures
    ocr_deprecated: OCR service tests that fail due to OCR service deprecation (not pipeline bugs)
    options_pipeline: Options pipeline tests (must 100% pass)
    structure_pipeline: Structure pipeline tests (OCR + split + normalize)
    ocr_dependency: External OCR service dependency tests
    integration: tests requiring PostgreSQL and/or Redis (see deploy/docker-compose.test.yml)
    ocr_service: requires external Windows PaddleX OCR service (not available in CI)
    gpu: requires an explicitly approved GPU test environment
addopts = -v --tb=short
