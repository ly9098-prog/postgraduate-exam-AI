[pytest]
testpaths = tests/ocr_pipeline/test_process_pool_lifecycle.py tests/cloud_isolation/test_cloud_ocr_isolation.py tests/ocr_regression tests/test_services tests/test_features tests/export tests/canary tests/ocr_pipeline/test_ocr_request.py tests/ocr_pipeline/test_module_result.py tests/architecture/test_document_ir_validator.py tests/architecture/test_backend_field_boundary.py tests/ocr_pipeline/test_ocr_adapter.py tests/ocr_pipeline/test_module_benchmarks.py
python_files = runner.py test_*.py
markers =
    ocr: OCR regression test cases
    real_image: Regression cases sourced from real device images
    synthetic: Regression cases sourced from synthetic text fixtures
    ocr_deprecated: OCR service tests that fail due to OCR service deprecation (not pipeline bugs)
    options_pipeline: Options pipeline tests (must 100% pass)
    structure_pipeline: Structure pipeline tests (OCR + split + normalize)
    ocr_dependency: External OCR service dependency tests
    integration: tests requiring PostgreSQL and/or Redis (see deploy/docker-compose.test.yml)
    ocr_service: requires external Windows PaddleX OCR service (not available in CI)
    gpu: requires an explicitly approved GPU test environment
addopts = -v --tb=short

# FastAPI 0.111 requires Starlette 0.37, which imports python-multipart using
# its deprecated compatibility module. Filter only this upstream import warning.
filterwarnings =
    ignore:Please use `import python_multipart` instead\.:PendingDeprecationWarning:starlette\.formparsers
