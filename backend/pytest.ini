[pytest]
testpaths = tests/ocr_regression tests/test_services
python_files = runner.py test_*.py
markers =
    ocr: OCR regression test cases
    real_image: Regression cases sourced from real device images
    synthetic: Regression cases sourced from synthetic text fixtures
    ocr_deprecated: OCR service tests that fail due to OCR service deprecation (not pipeline bugs)
    options_pipeline: Options pipeline tests (must 100% pass)
    structure_pipeline: Structure pipeline tests (OCR + split + normalize)
    ocr_dependency: External OCR service dependency tests
addopts = -v --tb=short
