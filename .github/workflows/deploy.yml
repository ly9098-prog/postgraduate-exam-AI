name: Deploy

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Full test runs use pytest-only dependencies such as fakeredis.
          pip install -e ".[test]"
          # Export tests verify CJK font loading on the runner.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei fonts-noto-cjk
      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          APP_SECRET: test-secret
        run: python -m pytest tests/ --ignore=tests/ocr_eval --ignore=tests/benchmarks --ignore=tests/manual -v --tb=short -rxf

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/2240ai-v2
            bash deploy/scripts/deploy.sh update
