name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # Required for the changed-file lint ratchet below.
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep the linter pinned to the local development version so rules do not drift.
          pip install ruff==0.15.21 mypy pip-audit bandit
          pip install -r requirements.txt
          # app.main imports the DOCX export stack during API/router import.
          # Keep CI explicit until python-docx is guaranteed by the runtime dependency lock.
          pip install python-docx
          pip install -e ".[test]"
          pip freeze > requirements-lock.txt

      - name: compileall — syntax check all Python files
        run: |
          python -c "
          import compileall, sys
          success = compileall.compile_dir('app/', quiet=2)
          if not success:
              print('compileall: FAILED')
              sys.exit(1)
          print('compileall: OK')
          "

      - name: Ruff correctness gate
        # I001/F401/N818 are existing repository debt. Keep every other configured
        # Ruff rule blocking so the workflow does not become a blanket lint bypass.
        run: ruff check app/ --output-format=github --ignore I001,F401,N818

      - name: Ruff debt ratchet for changed backend files
        # I001/F401/N818 are tracked as legacy debt by the full-tree report below.
        # For edited files, compare the current violation count with the base commit:
        # existing debt may remain, but a change must not increase it. All other Ruff
        # rules are already blocking in the full-tree correctness gate above.
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          base="${BASE_SHA:-}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              base="$(git rev-parse HEAD^)"
            else
              echo "No parent commit is available; skipping Ruff debt ratchet."
              exit 0
            fi
          fi

          EFFECTIVE_BASE_SHA="$base" python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from collections import Counter
          from pathlib import Path

          DEBT_RULES = "I001,F401,N818"
          base = os.environ["EFFECTIVE_BASE_SHA"]
          repo_root = Path(
              subprocess.check_output(
                  ["git", "rev-parse", "--show-toplevel"], text=True
              ).strip()
          )
          backend_root = repo_root / "backend"

          changed = subprocess.run(
              [
                  "git",
                  "-C",
                  str(repo_root),
                  "diff",
                  "--name-only",
                  "--diff-filter=ACMR",
                  base,
                  "HEAD",
                  "--",
                  "backend/app",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          root_files = [
              path
              for path in changed
              if path.startswith("backend/app/")
              and path.endswith(".py")
              and (repo_root / path).is_file()
          ]
          files = [path.removeprefix("backend/") for path in root_files]

          if not files:
              print("No changed backend/app Python files.")
              raise SystemExit(0)

          print(f"Ruff debt ratchet for {len(files)} changed file(s):")
          for path in files:
              print(f"  {path}")

          def run_ruff(args: list[str], *, source: str | None = None) -> list[dict]:
              result = subprocess.run(
                  ["ruff", "check", *args, "--select", DEBT_RULES, "--output-format=json"],
                  cwd=backend_root,
                  input=source,
                  capture_output=True,
                  text=True,
              )
              if result.returncode not in (0, 1):
                  if result.stdout:
                      print(result.stdout, file=sys.stderr)
                  if result.stderr:
                      print(result.stderr, file=sys.stderr)
                  raise SystemExit(result.returncode)
              try:
                  return json.loads(result.stdout or "[]")
              except json.JSONDecodeError:
                  print(result.stdout, file=sys.stderr)
                  print(result.stderr, file=sys.stderr)
                  raise

          def normalized_file(filename: str) -> str:
              path = Path(filename)
              if path.is_absolute():
                  try:
                      return path.resolve().relative_to(backend_root.resolve()).as_posix()
                  except ValueError:
                      return path.as_posix()
              value = path.as_posix().removeprefix("./")
              return value.removeprefix("backend/")

          head_diagnostics = run_ruff(files)
          head_counts = Counter(
              (normalized_file(item.get("filename", "")), item.get("code", ""))
              for item in head_diagnostics
          )

          base_counts: Counter[tuple[str, str]] = Counter()
          for root_path, relative in zip(root_files, files, strict=True):
              exists = subprocess.run(
                  ["git", "-C", str(repo_root), "cat-file", "-e", f"{base}:{root_path}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not exists:
                  continue

              source = subprocess.check_output(
                  ["git", "-C", str(repo_root), "show", f"{base}:{root_path}"],
                  text=True,
              )
              diagnostics = run_ruff(["--stdin-filename", relative, "-"], source=source)
              base_counts.update((relative, item.get("code", "")) for item in diagnostics)

          regressions: dict[tuple[str, str], tuple[int, int]] = {}
          for key, current_count in head_counts.items():
              previous_count = base_counts.get(key, 0)
              if current_count > previous_count:
                  regressions[key] = (previous_count, current_count)

          if not regressions:
              current_total = sum(head_counts.values())
              base_total = sum(base_counts.values())
              print(
                  "Ruff legacy-debt ratchet passed: "
                  f"base={base_total}, current={current_total}; no per-file rule count increased."
              )
              raise SystemExit(0)

          def command_escape(value: str) -> str:
              return (
                  value.replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )

          print("Ruff legacy debt increased:", file=sys.stderr)
          for (relative, code), (previous, current) in sorted(regressions.items()):
              print(
                  f"  {relative}: {code} {previous} -> {current}",
                  file=sys.stderr,
              )
              matching = [
                  item
                  for item in head_diagnostics
                  if normalized_file(item.get("filename", "")) == relative
                  and item.get("code", "") == code
              ]
              for item in matching:
                  location = item.get("location") or {}
                  row = int(location.get("row") or 1)
                  column = int(location.get("column") or 1)
                  message = command_escape(
                      f"{code} {item.get('message', '')} "
                      f"(legacy-debt ratchet: {previous} -> {current})"
                  )
                  print(
                      f"::error file=backend/{relative},line={row},col={column}::{message}"
                  )

          raise SystemExit(1)
          PY

      - name: Ruff legacy debt report
        # Keep annotations for the known debt so it remains visible and measurable,
        # while the changed-file gate prevents new debt from being introduced.
        run: ruff check app/ --select I001,F401,N818 --output-format=github --exit-zero

      - name: Ruff format check
        run: ruff format --check app/ || true
        continue-on-error: true  # formatting remains advisory while legacy files are migrated

      - name: MyPy type check
        run: mypy app/ || true
        continue-on-error: true  # type checking is advisory for now

      - name: Bandit security scan
        run: |
          bandit -r app/ -f json --severity-level high 2>&1 | head -50 || true
        continue-on-error: true

      - name: Dependency vulnerability scan
        run: pip-audit --desc on -r requirements-lock.txt || true
        continue-on-error: true

