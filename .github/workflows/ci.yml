      - name: Mocked readiness boundary regression
        env:
          APP_ENV: test
          DEPLOYMENT_PROFILE: local_import
          APP_SECRET: ci-secret-key-not-for-production-use-12345678
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: ""
          SENTRY_DSN: ""
          OCR_ENABLED: "false"
          STAGING_STORAGE_DIR: ${{ runner.temp }}/readiness-staging
        run: |
          # This file mocks dependency ports; --run-integration only opens its directory gate.
          # Do not expand to tests/integration/ without provisioning PostgreSQL/Redis.
          python -m pytest tests/test_api/test_health.py tests/test_api/test_admin_health.py \
            tests/integration/test_readiness.py --run-integration -v --tb=short

      - name: Cloud OCR profile boundary regression
        env:
          APP_ENV: test
          DEPLOYMENT_PROFILE: local_import
          APP_SECRET: ci-secret-key-not-for-production-use-12345678
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: ""
          SENTRY_DSN: ""
          OCR_ENABLED: "false"
          STAGING_STORAGE_DIR: ${{ runner.temp }}/cloud-profile-staging
        run: |
          python -m pytest tests/cloud_isolation/test_cloud_ocr_isolation.py -v --tb=short

      - name: Import smoke test
        run: |
          python -c "
          modules = [
              'app.core.config',
              'app.core.document_ir',
              'app.core.ai_trace',
              'app.services.ocr_executor_service',
              'app.features.candidate_evaluator',
              'app.features.ocr_vl.paddleocr_vl_client',
              'app.features.pipeline_artifacts',
          ]
          errors = []
          for m in modules:
              try:
                  __import__(m)
                  print(f'OK: {m}')
              except ImportError as e:
                  errors.append(f'{m}: {e}')
                  print(f'SKIP: {m} ({e})')
          if errors:
              print(f'\n{len(errors)} modules not importable')
          "

      - name: OCR Benchmark — text-only cases
        run: |
          python -m pytest tests/ocr_bench/test_bench.py -v --tb=short 2>&1
        continue-on-error: true  # benchmark is advisory — tracks regression trends

      - name: Save lock file artifact
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: backend/requirements-lock.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create CI env file for docker compose
        run: |
          cat > backend/.env.ci << 'CIEOF'
          APP_SECRET=ci-secret-key-not-for-production-use-12345678
          DATABASE_URL=sqlite+aiosqlite:///ci-test.db
          WECHAT_APP_ID=ci-app-id
          WECHAT_APP_SECRET=ci-app-secret
          DEEPSEEK_API_KEY=ci-ds-key
          AI_CONFIG_ENCRYPT_KEY=ci-encrypt-key-not-for-production-use
          CIEOF

      - name: Build app Docker image
        # A cold production build installs the OCR stack (including the ~195 MB
        # PaddlePaddle wheel). On GitHub-hosted runners this can legitimately
        # exceed 35 minutes when the configured package mirror is slow.
        run: docker compose --progress=plain -f deploy/docker-compose.prod.yml --env-file backend/.env.ci build app
        timeout-minutes: 90


  migration-cycle:
    name: Migration upgrade/downgrade cycle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Prepare migration database
        env:
          DATABASE_URL: sqlite:///migration-ci.db
        run: |
          rm -f migration-ci.db

      - name: Validate migration heads
        env:
          DATABASE_URL: sqlite:///migration-ci.db
        run: |
          heads=$(alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found:"
            alembic heads
            exit 1
          fi

      - name: Upgrade to latest revision
        env:
          DATABASE_URL: sqlite:///migration-ci.db
        run: |
          alembic upgrade head

      - name: Downgrade one revision and upgrade again
        env:
          DATABASE_URL: sqlite:///migration-ci.db
        run: |
          alembic downgrade -1
          alembic upgrade head


  migration-history-matrix:
    name: Migration history upgrade/downgrade matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Collect migration checkpoints
        id: revisions
        run: |
          python scripts/ci_collect_migration_checkpoints.py > migration-checkpoints.json
          echo "checkpoints=$(cat migration-checkpoints.json)" >> "$GITHUB_OUTPUT"

      - name: Run migration checkpoint cycle
        env:
          DATABASE_URL: sqlite:///migration-history-ci.db
        run: |
          python scripts/ci_migration_matrix_check.py migration-checkpoints.json
