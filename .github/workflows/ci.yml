name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # Required for the changed-file lint ratchet below.
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep the linter pinned to the local development version so rules do not drift.
          pip install ruff==0.15.21 mypy pip-audit bandit
          pip install -r requirements.txt
          # app.main imports the DOCX export stack during API/router import.
          # Keep CI explicit until python-docx is guaranteed by the runtime dependency lock.
          pip install python-docx
          pip install -e ".[test]"
          pip freeze > requirements-lock.txt

      - name: compileall — syntax check all Python files
        run: |
          python -c "
          import compileall, sys
          success = compileall.compile_dir('app/', quiet=2)
          if not success:
              print('compileall: FAILED')
              sys.exit(1)
          print('compileall: OK')
          "

      - name: Ruff correctness gate
        # I001/F401/N818 are existing repository debt. Keep every other configured
        # Ruff rule blocking so the workflow does not become a blanket lint bypass.
        run: ruff check app/ --output-format=github --ignore I001,F401,N818

      - name: Ruff strict gate for changed backend files
        # New/edited Python must satisfy the complete Ruff policy, including the
        # historical debt rules above. This gradually removes debt without touching
        # unrelated runtime code just to make CI green.
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          base="${BASE_SHA:-}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              base="$(git rev-parse HEAD^)"
            else
              echo "No parent commit is available; skipping changed-file Ruff gate."
              exit 0
            fi
          fi

          files=()
          while IFS= read -r path; do
            [[ "$path" == backend/app/*.py || "$path" == backend/app/**/*.py ]] || continue
            relative="${path#backend/}"
            [[ -f "$relative" ]] && files+=("$relative")
          done < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- app/ | grep -E '\.py$' || true)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No changed backend/app Python files."
            exit 0
          fi

          printf 'Strict Ruff check for %d changed file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          ruff check "${files[@]}" --output-format=github

      - name: Ruff legacy debt report
        # Keep annotations for the known debt so it remains visible and measurable,
        # while the changed-file gate prevents new debt from being introduced.
        run: ruff check app/ --select I001,F401,N818 --output-format=github --exit-zero

      - name: Ruff format check
        run: ruff format --check app/ || true
        continue-on-error: true  # formatting remains advisory while legacy files are migrated

      - name: MyPy type check
        run: mypy app/ || true
        continue-on-error: true  # type checking is advisory for now

      - name: Bandit security scan
        run: |
          bandit -r app/ -f json --severity-level high 2>&1 | head -50 || true
        continue-on-error: true

      - name: Dependency vulnerability scan
        run: pip-audit --desc on -r requirements-lock.txt || true
        continue-on-error: true

      - name: Static architecture & non-GPU regression tests
        run: |
          python -m pytest \
            tests/test_architecture_boundaries.py \
            tests/test_gateway_bypass_zero.py \
            tests/test_document_ir_production_write_zero.py \
            tests/test_artifact_path_traversal.py \
            tests/test_p5_ssrf_http_lifecycle.py \
            tests/test_coordinator_mode_e2e.py \
            tests/test_coordinator_boundaries.py \
            tests/test_coordinator_rollback.py \
            tests/test_pipeline_coordinator_shadow.py \
            tests/test_ai_capability_model_separation.py \
            tests/test_ai_model_config_resolver.py \
            tests/test_ai_config_snapshot.py \
            tests/test_code_integrity.py \
            tests/test_ocr_resume_equivalence.py \
            tests/test_candidate_evaluator_privacy.py \
            tests/test_pipeline_fingerprint.py \
            tests/test_artifact_fingerprint_compatibility.py \
            tests/test_p6_fingerprint_manifest.py \
            tests/test_unified_safety_evaluator.py \
            -v --tb=short 2>&1

      - name: Import smoke test
        run: |
          python -c "
          modules = [
              'app.core.config',
              'app.core.document_ir',
              'app.core.ai_trace',
              'app.services.ocr_executor_service',
              'app.features.candidate_evaluator',
              'app.features.ocr_vl.paddleocr_vl_client',
              'app.features.pipeline_artifacts',
          ]
          errors = []
          for m in modules:
              try:
                  __import__(m)
                  print(f'OK: {m}')
              except ImportError as e:
                  errors.append(f'{m}: {e}')
                  print(f'SKIP: {m} ({e})')
          if errors:
              print(f'\n{len(errors)} modules not importable')
          "

      - name: OCR Benchmark — text-only cases
        run: |
          python -m pytest tests/ocr_bench/test_bench.py -v --tb=short 2>&1
        continue-on-error: true  # benchmark is advisory — tracks regression trends

      - name: Save lock file artifact
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: backend/requirements-lock.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create CI env file for docker compose
        run: |
          cat > backend/.env.ci << 'CIEOF'
          APP_SECRET=ci-secret-key-not-for-production-use-12345678
          DATABASE_URL=sqlite+aiosqlite:///ci-test.db
          WECHAT_APP_ID=ci-app-id
          WECHAT_APP_SECRET=ci-app-secret
          DEEPSEEK_API_KEY=ci-ds-key
          AI_CONFIG_ENCRYPT_KEY=ci-encrypt-key-not-for-production-use
          CIEOF

      - name: Build app Docker image
        run: docker compose -f deploy/docker-compose.prod.yml --env-file backend/.env.ci build app --progress=plain
        timeout-minutes: 15
