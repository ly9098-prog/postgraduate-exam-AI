name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pyproject.toml pip-audit
          pip install -r requirements.txt || true

      - name: Ruff lint
        run: ruff check app/ --output-format=github || true

      - name: MyPy type check
        run: mypy app/ || true

      - name: Import boundary audit
        run: python ../scripts/check_ocr_imports.py

      - name: Generate lock file
        run: pip freeze > requirements-lock.txt

      - name: Dependency vulnerability scan
        run: pip-audit --desc on -r requirements.txt --ignore-vuln PYSEC-2024-123 || true

      - name: Full module import smoke test
        run: |
          python -c "
          modules = [
              'app.core.config',
              'app.core.log_context',
              'app.core.document_ir',
              'app.core.transform_tracker',
              'app.core.ocr_runtime_config',
              'app.services.ocr_executor_service',
              'app.features.candidate_evaluator',
          ]
          for m in modules:
              try:
                  __import__(m)
                  print(f'OK: {m}')
              except ImportError as e:
                  print(f'SKIP: {m} ({e})')
          "

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app Docker image
        run: docker compose -f deploy/docker-compose.prod.yml build app --progress=plain
        timeout-minutes: 15
