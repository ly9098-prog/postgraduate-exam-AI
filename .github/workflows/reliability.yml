name: Reliability Gate

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memograd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memograd_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      APP_ENV: test
      APP_SECRET: ci-only-secret
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/memograd_test
      REDIS_URL: redis://127.0.0.1:6379/15
      PYTHONPATH: ${{ github.workspace }}/backend
      OCR_ENABLED: "false"
      VECTOR_ENABLED: "false"
      ALLOW_IN_MEMORY_TASK_QUEUE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # app.main imports the DOCX export stack during router import.
          pip install python-docx pytest pytest-asyncio

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Apply all Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Verify database revision matches Alembic heads
        working-directory: backend
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import os

          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy.ext.asyncio import create_async_engine

          config = Config("alembic.ini")
          script = ScriptDirectory.from_config(config)
          expected_heads = set(script.get_heads())

          async def current_heads() -> set[str]:
              engine = create_async_engine(os.environ["DATABASE_URL"])
              try:
                  async with engine.connect() as connection:
                      return set(
                          await connection.run_sync(
                              lambda sync_connection: MigrationContext.configure(
                                  sync_connection
                              ).get_current_heads()
                          )
                      )
              finally:
                  await engine.dispose()

          actual_heads = asyncio.run(current_heads())
          print(f"Alembic heads: {sorted(expected_heads)}")
          print(f"Database heads: {sorted(actual_heads)}")

          if actual_heads != expected_heads:
              raise SystemExit("Database revision does not match repository Alembic heads")
          PY

      - name: Verify ORM-to-migration schema contract
        working-directory: backend
        run: alembic check

      - name: Run reliability unit and integration tests
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            backend/tests/unit/test_practice_recommendation_pipeline.py
            backend/tests/unit/test_task_queue_reliability.py
            backend/tests/unit/test_local_runtime_and_outbox_backoff.py
            backend/tests/unit/test_task_observability.py
            backend/tests/unit/test_ai_resource_governance.py
            backend/tests/contract/test_openapi_contract.py
            backend/tests/integration/test_practice_answer_projection.py
            backend/tests/integration/test_answer_projection_reconciliation.py
            backend/tests/integration/test_shared_ai_token_budget.py
          )

          tests=()
          missing=()
          for candidate in "${candidates[@]}"; do
            if [[ -f "$candidate" ]]; then
              tests+=("$candidate")
              continue
            fi

            mapfile -t matches < <(
              find backend/tests -type f -name "$(basename "$candidate")" -print 2>/dev/null | sort
            )
            if [[ ${#matches[@]} -eq 1 ]]; then
              echo "Resolved moved test: $candidate -> ${matches[0]}"
              tests+=("${matches[0]}")
            else
              missing+=("$candidate")
              echo "::warning file=$candidate::Configured reliability test is not present in this revision"
            fi
          done

          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "::error::None of the configured reliability tests exist in backend/tests"
            find backend/tests -type f -name 'test_*.py' -print 2>/dev/null | sort | head -200 || true
            exit 1
          fi

          printf 'Running %d reliability test file(s)' "${#tests[@]}"
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf ' (%d configured path(s) unavailable)' "${#missing[@]}"
          fi
          printf ':\n'
          printf '  %s\n' "${tests[@]}"
          pytest -q "${tests[@]}"

  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      APP_SECRET: ci-only-secret
      DATABASE_URL: sqlite+aiosqlite:///./contract.db
      PROCESS_ROLE: web
      LOCAL_ASYNC_RUNTIME_ENABLED: "false"
      OCR_ENABLED: "false"
      VECTOR_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Required by app.services.export.docx_exporter during app.main import.
          pip install python-docx

      - name: Export deterministic OpenAPI contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from app.main import app

          output = Path(".contract/openapi.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(
                  app.openapi(),
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          print(f"Wrote {output}")
          PY

      - name: Verify exported admin API contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract_path = Path(".contract/openapi.json")
          document = json.loads(contract_path.read_text(encoding="utf-8"))
          paths = document.get("paths", {})

          if not document.get("openapi"):
              raise SystemExit("OpenAPI version is missing from exported contract")
          if not paths:
              raise SystemExit("Exported OpenAPI contract contains no paths")
          if not any(path.startswith("/api/admin/v1/") for path in paths):
              raise SystemExit("Exported contract contains no admin API operations")

          operation_count = sum(
              1
              for path_item in paths.values()
              for method in path_item
              if method.lower()
              in {"get", "post", "put", "patch", "delete", "options", "head"}
          )
          if operation_count == 0:
              raise SystemExit("Exported OpenAPI contract contains no operations")

          print(f"OpenAPI contract OK: {len(paths)} paths, {operation_count} operations")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate TypeScript from FastAPI OpenAPI
        run: node admin-frontend/scripts/generate-openapi-types.mjs .contract/openapi.json admin-frontend/.contract/openapi.ts

      - name: Type-check critical admin response contracts
        working-directory: admin-frontend
        run: npx --yes --package=typescript@5.9.2 tsc -p contracts/tsconfig.json

      - name: Upload generated OpenAPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: |
            .contract/openapi.json
            admin-frontend/.contract/openapi.ts
          if-no-files-found: error
          retention-days: 7

  admin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect admin frontend manifest
        id: admin-manifest
        shell: bash
        run: |
          if [[ -f admin-frontend/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "admin-frontend/package.json not present; skipping admin build"
          fi

      - name: Set up Node.js
        if: steps.admin-manifest.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install admin dependencies
        if: steps.admin-manifest.outputs.present == 'true'
        working-directory: admin-frontend
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Pomodoro module boundaries and lifecycle regressions
        run: |
          node miniprogram/scripts/architecture/pomodoro-boundaries.js
          node --test \
            miniprogram/tests/test-pomodoro-module-boundaries.js \
            miniprogram/tests/test-pomodoro-hide-storage.js \
            miniprogram/tests/test-pomodoro-show-recovery.js \
            miniprogram/tests/test-pomodoro-confirm-recovery.js \
            miniprogram/tests/test-pomodoro-completion-recovery.js \
            miniprogram/tests/test-pomodoro-active-session-recovery.js \
            miniprogram/tests/test-pomodoro-sync-retry-controller.js \
            miniprogram/tests/test-pomodoro-pending-sync.js \
            miniprogram/tests/test-pomodoro-timer-math.js \
            miniprogram/tests/test-pomodoro-countdown-session-restore-controller.js \
            miniprogram/tests/test-pomodoro-free-session-restore-controller.js \
            miniprogram/tests/test-pomodoro-start-session-controller.js \
            miniprogram/tests/test-pomodoro-unknown-start-controller.js \
            miniprogram/tests/test-pomodoro-pending-sync-controller.js \
            miniprogram/tests/test-pomodoro-terminal-conflict-controller.js \
            miniprogram/tests/test-pomodoro-stats-controller.js \
            miniprogram/tests/test-pomodoro-theme-controller.js \
            miniprogram/tests/test-pomodoro-end-confirm-snapshot.js \
            miniprogram/tests/test-pomodoro-active-sync-controller.js \
            miniprogram/tests/test-pomodoro-pause-toggle-controller.js \
            miniprogram/tests/test-pomodoro-resume-error-controller.js \
            miniprogram/tests/test-pomodoro-celebration-dismiss-controller.js \
            miniprogram/tests/test-pomodoro-break-restore-controller.js \
            miniprogram/tests/test-pomodoro-completion-celebration-controller.js \
            miniprogram/tests/test-pomodoro-work-complete-controller.js \
            miniprogram/tests/test-pomodoro-free-timer-begin-controller.js \
            miniprogram/tests/test-pomodoro-cancel-end-confirm-controller.js \
            miniprogram/tests/test-pomodoro-show-end-free-confirm-controller.js \
            miniprogram/tests/test-pomodoro-pause-countdown-end-confirm-controller.js \
            miniprogram/tests/test-pomodoro-confirm-interrupt-countdown-controller.js \
            miniprogram/tests/test-pomodoro-reset-to-idle-controller.js \
            miniprogram/tests/test-pomodoro-update-free-elapsed-controller.js \
            miniprogram/tests/test-pomodoro-begin-countdown-controller.js \
            miniprogram/tests/test-pomodoro-pause-session-controller.js \
            miniprogram/tests/test-pomodoro-resume-session-controller.js \
            miniprogram/tests/test-pomodoro-show-countdown-interrupt-confirm-controller.js \
            miniprogram/tests/test-pomodoro-confirm-end-timer-controller.js \
            miniprogram/tests/test-pomodoro-end-session-controller.js \
            miniprogram/tests/test-pomodoro-pause-free-timer-controller.js \
            miniprogram/tests/test-pomodoro-resume-free-timer-controller.js \
            miniprogram/tests/test-pomodoro-interrupt-session-controller.js \
            miniprogram/tests/test-pomodoro-confirm-end-free-timer-controller.js \
            miniprogram/tests/test-pomodoro-free-timer-limit-controller.js \
            miniprogram/tests/test-pomodoro-free-elapsed-controller.js \
            miniprogram/tests/test-pomodoro-start-break-controller.js \
            miniprogram/tests/test-pomodoro-start-timer-controller.js \
            miniprogram/tests/test-pomodoro-canvas-init-controller.js \
            miniprogram/tests/test-pomodoro-draw-ring-controller.js
          node miniprogram/scripts/test-pomodoro-stability-runtime.js
          node miniprogram/scripts/test-pomodoro-resilience.js
          node miniprogram/scripts/test-pomodoro-resume-latency.js
          node miniprogram/scripts/test-pomodoro-free-timer-limit.js
          node miniprogram/tests/test-storage-session-cleanup.js
          node miniprogram/tests/test-exam-terminal-navigation.js
          node miniprogram/tests/test-render-invariant.js
          node miniprogram/tests/render_regression/run.js

      - name: Build admin frontend
        if: steps.admin-manifest.outputs.present == 'true'
        working-directory: admin-frontend
        env:
          NEXT_PUBLIC_ADMIN_API_BASE_URL: http://127.0.0.1:8000/api/admin/v1
        run: npm run build
