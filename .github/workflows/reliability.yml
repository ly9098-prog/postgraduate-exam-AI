name: Reliability Gate

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memograd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memograd_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      APP_ENV: test
      APP_SECRET: ci-only-secret
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/memograd_test
      REDIS_URL: redis://127.0.0.1:6379/15
      PYTHONPATH: ${{ github.workspace }}/backend
      OCR_ENABLED: "false"
      VECTOR_ENABLED: "false"
      ALLOW_IN_MEMORY_TASK_QUEUE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Apply all Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Verify ORM and migration heads are in sync
        working-directory: backend
        run: alembic check

      - name: Run reliability unit and integration tests
        run: |
          pytest -q \
            backend/tests/unit/test_practice_recommendation_pipeline.py \
            backend/tests/unit/test_task_queue_reliability.py \
            backend/tests/unit/test_local_runtime_and_outbox_backoff.py \
            backend/tests/unit/test_task_observability.py \
            backend/tests/unit/test_ai_resource_governance.py \
            backend/tests/integration/test_practice_answer_projection.py \
            backend/tests/integration/test_answer_projection_reconciliation.py \
            backend/tests/integration/test_shared_ai_token_budget.py

  admin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect admin frontend manifest
        id: admin-manifest
        shell: bash
        run: |
          if [[ -f admin-frontend/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "admin-frontend/package.json not present; skipping admin build"
          fi

      - name: Set up Node.js
        if: steps.admin-manifest.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install admin dependencies
        if: steps.admin-manifest.outputs.present == 'true'
        working-directory: admin-frontend
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build admin frontend
        if: steps.admin-manifest.outputs.present == 'true'
        working-directory: admin-frontend
        env:
          NEXT_PUBLIC_ADMIN_API_BASE_URL: http://127.0.0.1:8000/api/admin/v1
        run: npm run build
