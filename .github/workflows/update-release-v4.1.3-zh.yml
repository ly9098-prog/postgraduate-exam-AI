name: Update Release v4.1.3 Notes (zh)

on:
  push:
    branches:
      - chore/update-release-v4.1.3-zh

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'ly9098-prog/postgraduate-exam-AI'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v4.1.3 \
            --repo "$GITHUB_REPOSITORY" \
            --title "v4.1.3 — 部署配置、OCR 边界与路径治理" \
            --notes-file .github/release-notes/v4.1.3-zh.md

      - name: Show release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4.1.3 --repo "$GITHUB_REPOSITORY" --json tagName,name,url
